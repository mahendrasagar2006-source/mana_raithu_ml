<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mana Raithu Nestham - Crop Recommendation</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<header class="masthead">
  <div class="arcs" aria-hidden="true">
    <svg viewBox="0 0 800 200" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    </svg>
  </div>
  <div class="content">
    <img class="logo" src="{{ url_for('static', filename='logo.png') }}" alt="Mana Raithu Nestham">
    <h1>Know what to grow, before you sow</h1>
    <p>A quick field check for farmers in Telangana &amp; Andhra Pradesh</p>
  </div>
</header>

<div class="container">

  <div class="ledger">
    <div class="ledger-inner">

      {% if error %}
      <div class="error">{{ error }}</div>
      {% endif %}

      <form action="/predict" method="POST">

        <div class="entry">
          <div class="body">
            <p class="heading">Location &amp; season</p>
            <div class="row">
              <div class="field">
                <label for="state">State</label>
                <div class="select-wrap icon-pin">
                  <select id="state" name="state" required>
                  {% for s in states %}
                  <option value="{{ s }}">{{ s }}</option>
                  {% endfor %}
                </select>
                </div>
              </div>
              <div class="field">
                <label for="season">Season</label>
                <div class="select-wrap icon-calendar">
                  <select id="season" name="season" required>
                  {% for s in seasons %}
                  <option value="{{ s }}">{{ s }}</option>
                  {% endfor %}
                </select>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="entry">
          <div class="body">
            <p class="heading">Soil &amp; water</p>
            <div class="row">
              <div class="field">
                <label for="soil_type">Soil type</label>
                <div class="select-wrap icon-layers">
                  <select id="soil_type" name="soil_type" required>
                  {% for s in soil_types %}
                  <option value="{{ s }}">{{ s }}</option>
                  {% endfor %}
                </select>
                </div>
              </div>
              <div class="field">
                <label for="water_availability">Water availability</label>
                <div class="select-wrap icon-droplet">
                  <select id="water_availability" name="water_availability" required>
                  {% for w in water_availabilities %}
                  <option value="{{ w }}">{{ w }}</option>
                  {% endfor %}
                </select>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="entry">
          <div class="body">
            <p class="heading">Crop history</p>
            <div class="field">
              <label for="previous_crop">Previous crop</label>
              <div class="select-wrap icon-seed">
                  <select id="previous_crop" name="previous_crop" required>
                {% for c in previous_crops %}
                <option value="{{ c }}">{{ c }}</option>
                {% endfor %}
              </select>
                </div>
            </div>
          </div>
        </div>

        <div class="entry">
          <div class="body">
            <p class="heading">Land &amp; weather</p>
            <div class="row">
              <div class="field">
                <label for="land_area">Land area (acres)</label>
                <input type="number" id="land_area" step="1" min="1" name="land_area" required>
              </div>
              <div class="field">
                <label for="temperature">Temperature (°C)</label>
                <input type="number" id="temperature" step="0.1" name="temperature" required>
              </div>
            </div>
            <div class="field">
              <label for="rainfall">Rainfall (mm)</label>
              <input type="number" id="rainfall" step="1" name="rainfall" required>
            </div>
          </div>
        </div>

        <div class="submit-wrap">
          <button type="submit" class="cta">Get recommendation</button>
        </div>

      </form>

    </div>
  </div>

</div>

</body>
</html>
